[project]
name = "nuage"
version = "0.1.0"
description = "Nuage CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
nuage = "nuage.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/cli/src/nuage"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]